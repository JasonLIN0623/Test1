<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Red vs Blue Last Ball Standing</title>
    <link rel="stylesheet" href="styles.css?v=20260629-four-teams" />
  </head>
  <body>
    <main class="game-shell">
      <section class="hud" aria-label="戰況">
        <div id="redTeamPanel" class="team-panel red">
          <div class="team-row">
            <span>RED</span>
            <strong id="redCount">0</strong>
          </div>
          <div class="bar" aria-hidden="true">
            <span id="redHealth"></span>
          </div>
        </div>

        <div class="round-panel">
          <strong id="roundStatus">LAST BALL STANDING</strong>
          <span id="timer">00:00</span>
        </div>

        <div id="blueTeamPanel" class="team-panel blue">
          <div class="team-row">
            <span>BLUE</span>
            <strong id="blueCount">0</strong>
          </div>
          <div class="bar" aria-hidden="true">
            <span id="blueHealth"></span>
          </div>
        </div>

        <div id="greenTeamPanel" class="team-panel green hidden">
          <div class="team-row">
            <span>GREEN</span>
            <strong id="greenCount">0</strong>
          </div>
          <div class="bar" aria-hidden="true">
            <span id="greenHealth"></span>
          </div>
        </div>

        <div id="goldTeamPanel" class="team-panel gold hidden">
          <div class="team-row">
            <span>GOLD</span>
            <strong id="goldCount">0</strong>
          </div>
          <div class="bar" aria-hidden="true">
            <span id="goldHealth"></span>
          </div>
        </div>
      </section>

      <section class="arena-wrap" aria-label="遊戲區域">
        <canvas id="gameCanvas" width="900" height="900"></canvas>
        <div id="winnerBanner" class="winner-banner hidden">
          <span id="winnerText">RED WINS</span>
          <button id="playAgainButton" type="button">再戰一局</button>
        </div>
      </section>

      <section class="team-views" aria-label="隊伍視角">
        <article class="view-panel red-view">
          <div class="view-title">
            <span>RED POV</span>
            <strong>紅方視角</strong>
          </div>
          <canvas id="redViewCanvas" width="360" height="240"></canvas>
        </article>
        <article class="view-panel blue-view">
          <div class="view-title">
            <span>BLUE POV</span>
            <strong>藍方視角</strong>
          </div>
          <canvas id="blueViewCanvas" width="360" height="240"></canvas>
        </article>
        <article class="view-panel green-view">
          <div class="view-title">
            <span>GREEN POV</span>
            <strong>綠方視角</strong>
          </div>
          <canvas id="greenViewCanvas" width="360" height="240"></canvas>
        </article>
        <article class="view-panel gold-view">
          <div class="view-title">
            <span>GOLD POV</span>
            <strong>金方視角</strong>
          </div>
          <canvas id="goldViewCanvas" width="360" height="240"></canvas>
        </article>
      </section>

      <section class="controls" aria-label="控制列">
        <div class="mode-control" role="group" aria-label="戰鬥模式">
          <button id="groupModeButton" class="active" type="button">團體戰</button>
          <button id="duelModeButton" type="button">個人戰</button>
          <button id="roomModeButton" type="button">房間戰</button>
        </div>
        <button id="startButton" type="button">開始</button>
        <button id="resetButton" type="button">重置</button>
        <label class="control-field">
          <span>球數</span>
          <input id="ballCountInput" type="range" min="3" max="12" value="7" />
          <strong id="ballCountValue">7</strong>
        </label>
        <label class="control-field">
          <span>速度</span>
          <input id="speedInput" type="range" min="70" max="150" value="100" />
          <strong id="speedValue">100%</strong>
        </label>
      </section>
    </main>

    <script src="game.js?v=20260629-grid-cqb"></script>
  </body>
</html>
